name: Prepare olympiads.pro release

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - 'tests/**'
      - 'scripts/publish-olympiads.sh'
      - '.github/workflows/publish-olympiads.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-olympiads
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check the lessons
        run: node --test --test-isolation=none tests/*.test.cjs
      - name: Publish public files to the olympiads branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/publish-olympiads.sh
