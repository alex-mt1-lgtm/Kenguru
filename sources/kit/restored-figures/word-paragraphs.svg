<text x="106" y="288.6" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">Американцы·(на·повышенных·тонах):·С·вами·говорит·капитан·Ричард·Джеймс·Ховард,</text>
<text x="43" y="313.70000000000005" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">командующий·авианосца·USS·LINCOLN,·военно-морского·флота·Соединённых·Штатов</text>
<text x="43" y="338.8" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">Америки,·второго·по·величине·военного·корабля·американского·флота.·Нас·сопровождают·2</text>
<text x="43" y="363.9" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">крейсера,·6·истребителей,·4·подводные·лодки·и·многочисленные·корабли·поддержки.·Я·вам·не</text>
<text x="43" y="389.0" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">«советую»,·я·«приказываю»·изменить·ваш·курс·на·15·градусов·на·север.·В·противном·случае</text>
<text x="43" y="414.1" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">мы·будем·вынуждены·принять·необходимые·меры·для·обеспечения·безопасности·нашего</text>
<text x="43" y="439.20000000000005" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">корабля.·Пожалуйста,·немедленно·уберитесь·с·нашего·курса!!!¶</text>
<text x="43" y="464.3" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">¶</text>
<text x="106" y="489.40000000000003" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">Испанцы:·С·вами·говорит·Хуан·Мануэль·Салас·Алкантара.·Нас·2·человека.·Нас</text>
<text x="43" y="514.5" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">сопровождают·наш·пёс,·ужин,·2·бутылки·колы·и·канарейка,·которая·сейчас·спит.·Нас</text>
<text x="43" y="539.6" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">поддерживают·радиостанция·«Cadena·Dial·de·La·Coruna»·и·канал·106·«Экстремальные</text>
<text x="43" y="564.7" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">ситуации·в·море».·Мы·не·собираемся·никуда·сворачивать,·учитывая,·что·мы·находимся·на</text>
<text x="43" y="589.8" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">суше·и·являемся·маяком·A-853·побережья·Испании.·Мы·не·имеем·ни·малейшего·понятия,</text>
<text x="43" y="614.9000000000001" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">какое·место·по·величине·мы·занимаем·среди·испанских·маяков.·Можете·принять·все</text>
