<text x="106" y="213.3" text-anchor="start" fill="#151515" font-family="DejaVu Serif" font-size="18" font-weight="normal">Испанцы:·Мы·не·считаем·ваше·предложение·ни·возможным,·ни·адекватным,·советуем</text>
